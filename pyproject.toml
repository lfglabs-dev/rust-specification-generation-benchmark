[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsgb"
version = "1.0.0"
description = "Rust Specification Generation Benchmark: Lean 4 + Z3 SMT equivalence verifier and reference agent runner"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["z3-solver>=4.12"]

[tool.setuptools]
packages = ["rfvb", "rsgb"]

[tool.setuptools.package-data]
rfvb = ["prompts/*.md"]
rsgb = ["prompts/*.md"]
